# DeployBuddy Automated Deployment Workflow
# Target: GitHub Pages (Static Site)
# Generated by DeployBuddy - Safe, inspectable, and student-friendly

name: Deploy with DeployBuddy to GitHub Pages

# 1. Trigger deployment on push to the default branch or allow manual execution
on:
  push:
    branches:
      - main
  workflow_dispatch:

# 2. Least-privilege permissions block:
# Only request permissions needed to read code and publish to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 3. Concurrency management:
# Allow one concurrent deployment at a time, queueing any new runs
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Deploy job for plain HTML site (no build step required)
  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages environment
        uses: actions/configure-pages@v5

      # Upload plain HTML directory directly as pages artifact
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      # Deploy artifact to GitHub Pages hosting
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
